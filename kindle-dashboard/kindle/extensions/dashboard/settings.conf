# Dashboard settings (sourced by the shell scripts, so keep the NAME="value" format).
# IMPORTANT: save this file with Unix (LF) line endings, not Windows (CRLF).

# Where the pictures are published. Two forms are understood:
#  - a folder URL (no .png at the end): the scripts download URL/today.png and URL/10d.png.
#    This is the GitHub Pages setup: https://<user>.github.io/<repo>
#  - a full .png URL: the PC server mode (python dashboard.py); the scripts add ?view=...&batt=...
#  - a path starting with "/": a local file, handy for a first test.
URL="https://scottinnes-ui.github.io/kindle-dashboard"

# How to download. "auto" tries wget, then curl. If the Kindle can't do HTTPS (see the "Test HTTPS" menu item)
# GitHub Pages won't work directly, see README. Set CURL_INSECURE=1 to let curl skip certificate checks
# (the Kindle 4's old certificate store often can't verify modern sites; the picture is public data).
FETCHER="auto"
CURL_INSECURE=0

# Seconds between checks. The screen is only redrawn when the picture changed.
INTERVAL=600

# Rotate the picture on the PC side: 0, 90, 180 or 270 (try 90/270 if it appears sideways).
ROT=0

# Full-flash refresh on every Nth redraw (1 = always flash and never ghost, 0 = never flash).
FULL_EVERY=1

# Hardware buttons (Kindle 4 has no touch). Linux key codes, find yours with the "Key test" menu item.
KEYDEV="/dev/input/event0"
HOME_KEYS="102 158"        # Home, Back      -> stop dashboard and return to the Kindle UI
NEXT_KEYS="104 109 105 106" # page buttons / 5-way left-right -> switch Today <-> 10 days

# 1 = freeze the Kindle UI (cvm) while the dashboard runs so it can't draw over the picture.
FREEZE_UI=1
# What to do when stopping: "restart" restarts the Kindle framework (~30 s, always repaints),
# "cont" just resumes the frozen UI (instant, but the screen may stay on the dashboard until a key press).
RESTORE="restart"
